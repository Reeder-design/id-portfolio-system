name: Validate Portfolio

# Keep this workflow aligned with the Portfolio Manager Run Full Validation action.
on:
  pull_request:
    paths:
      - "portfolio/**"
      - "portfolio-data/**"
      - "portfolio-manager/**"
      - "templates/**"
      - "scripts/**"
      - "docs/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/validate-site.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate portfolio
        run: python scripts/check-site.py

      - name: Validate structured project content
        run: python scripts/check-content.py

      - name: Validate structured general page content
        run: python scripts/check-site-content.py

      - name: Validate final public polish and mobile readiness
        run: python scripts/check-final-polish.py

      - name: Validate public privacy and leakage boundaries
        run: python scripts/check-public-privacy.py

      - name: Validate project renderer
        run: python scripts/check-renderer.py

      - name: Validate new project generator
        run: python scripts/check-new-project.py

      - name: Validate documentation versioning
        run: python scripts/check-docs.py

      - name: Validate generated documentation
        run: python scripts/update-docs.py --check

      - name: Install Portfolio Manager dependencies
        run: python -m pip install -r portfolio-manager/requirements.txt

      - name: Validate Portfolio Manager security and runtime
        run: |
          python -m py_compile portfolio-manager/*.py
          python scripts/check-git-workflow.py
          python scripts/check-ai-assistance.py
          python scripts/check-ai-file-uploads.py
          python scripts/check-ai-proposal-handoff.py
          python scripts/check-manage-ai-review.py
          python scripts/check-manage-assets.py
          python scripts/check-related-references.py
          python scripts/check-create-content.py
          python scripts/check-create-content-sources.py
          python scripts/check-create-content-build.py
          python scripts/check-create-publish-bridge.py
          python scripts/check-reference-library.py
          python scripts/check-reference-ai-analysis.py
          python scripts/check-reference-sanitization.py
          python scripts/check-help-privacy.py
          python scripts/check-final-polish.py
          python scripts/check-portfolio-manager.py
          python scripts/check-security-hardening.py
          python scripts/check-portfolio-manager-runtime.py
          python scripts/check-adversarial-qa.py
