name: Portfolio Visual Preview

on:
  pull_request:
    paths:
      - 'portfolio/**'
      - 'templates/**'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Render page families and check phone navigation
        run: node scripts/visual-qa.mjs
      - name: Upload review screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-preview
          path: visual-qa/
          if-no-files-found: ignore
