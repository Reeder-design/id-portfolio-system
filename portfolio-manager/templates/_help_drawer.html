<template data-help-template="maintenance">
    <p><strong>Normal workflow:</strong> edit content or assets → preview → run Full Validation → open Save &amp; Publish → review changed files → commit → publish to GitHub when ready.</p>
    <p><strong>Project Content:</strong> edits structured project records. Standard pages can be regenerated; custom interactive pages are protected.</p>
    <p><strong>General Page Content:</strong> edits approved text fields only and validates/rolls back automatically.</p>
    <p><strong>Asset Library:</strong> manages files intentionally approved for the public portfolio.</p>
    <p><strong>AI Assistance:</strong> creates private proposals only. AI cannot apply changes or publish.</p>
    <p><strong>Save &amp; Publish:</strong> commits validated edits to local <code>main</code>, then publishes them only when you explicitly push to GitHub.</p>
    <p><strong>Advanced Maintenance:</strong> Refresh Docs and Version Release are low-frequency tools, not required for routine edits.</p>
</template>

<template data-help-template="validation">
    <p><strong>Run Full Validation</strong> is a read-only health check across the public site, structured content, renderers, docs, Git guardrails, AI guardrails, and Portfolio Manager security/runtime rules.</p>
    <p><strong>It changes:</strong> nothing.</p>
    <p><strong>Next step:</strong> if it passes, review your changes in Save &amp; Publish. The commit action runs the same validation again.</p>
</template>

<template data-help-template="refresh-docs">
    <p><strong>Refresh Docs</strong> rebuilds maintenance records such as the content inventory, portfolio map, and changelog.</p>
    <p>It does not rewrite public pages, commit changes, or publish anything.</p>
</template>

<template data-help-template="versioning">
    <p><strong>Version Release</strong> records an intentional portfolio-system release.</p>
    <p><strong>Patch:</strong> small fixes. <strong>Minor:</strong> meaningful new feature/project. <strong>Major:</strong> major architecture or redesign.</p>
    <p>It updates version history and documentation locally. It does not commit or publish anything.</p>
</template>

<template data-help-template="create-project">
    <p><strong>Create Project</strong> creates a structured project record and, when appropriate, a standard public case-study page in the correct taxonomy path.</p>
    <p>It validates the project and refreshes generated documentation. It does not commit or publish.</p>
    <p><strong>Next step:</strong> preview the page, refine the project data, then use Save &amp; Publish.</p>
</template>

<template data-help-template="save-project">
    <p><strong>Save Project Data</strong> updates the project's structured JSON source and refreshes generated documentation.</p>
    <p>If structured-content validation fails, the JSON edit is rolled back.</p>
    <p><strong>Standard page:</strong> regenerate after saving when public HTML should reflect the updated data. <strong>Custom page:</strong> bespoke code is not overwritten.</p>
</template>

<template data-help-template="general-content">
    <p><strong>General Page Content</strong> manages predefined plain-text fields on Home, About, Projects, category pages, and Contact.</p>
    <p>Navigation, links, buttons, tags, lists, CSS, JavaScript, layout, and custom interactions remain outside this editor.</p>
    <p>Each field maps to one approved locator. If a locator is missing or ambiguous, saving fails instead of guessing.</p>
</template>

<template data-help-template="general-save">
    <p><strong>Save Page Copy</strong> updates both structured general-page data and the approved text locations in public HTML locally.</p>
    <p>Public-safe confirmation is required. Validation runs immediately and both files roll back on failure.</p>
    <p>It does not commit or publish. Preview the page, then use Save &amp; Publish.</p>
</template>

<template data-help-template="regenerate">
    <p><strong>Regenerate Page</strong> rebuilds a standard project's public HTML from its current JSON data and the shared template.</p>
    <p>This action is unavailable for custom interactive pages and does not commit or publish.</p>
</template>

<template data-help-template="standard-custom">
    <p><strong>Standard Page:</strong> generated from structured JSON + the shared project template and can be safely regenerated.</p>
    <p><strong>Custom Page:</strong> contains bespoke HTML/CSS/JavaScript. Metadata can be edited, but the generic renderer cannot overwrite the custom experience.</p>
</template>

<template data-help-template="assets">
    <p><strong>Asset Library</strong> manages files intentionally destined for the public portfolio.</p>
    <p>Managed assets live under <code>portfolio/assets/project-assets/</code>. Anything under <code>portfolio/</code> may become publicly reachable after publishing.</p>
    <p>Keep confidential, proprietary, customer-identifying, or unsanitized source material outside the public portfolio.</p>
</template>

<template data-help-template="asset-upload">
    <p><strong>Add Public Asset</strong> copies an allowed file into the project's managed public-asset folder and records its metadata.</p>
    <p>Public-safe confirmation is required. Images require alt text. Web-code/executable formats are intentionally blocked.</p>
</template>

<template data-help-template="asset-replace">
    <p><strong>Replace File</strong> swaps the bytes at an existing managed asset path while keeping the path unchanged.</p>
    <p>The extension must stay the same. Site validation runs afterward and restores the previous file on failure.</p>
</template>

<template data-help-template="ai-assistance">
    <p><strong>AI Assistance</strong> creates private proposals for rewriting, sanitization, analysis, placement/tags, and project summaries.</p>
    <p>Only source/context you deliberately enter is sent, plus the public portfolio taxonomy. AI cannot edit portfolio files, commit, or publish.</p>
    <p>Do not send source material you are not authorized to share with the configured external AI provider.</p>
</template>

<template data-help-template="ai-proposal">
    <p><strong>AI Proposal Review</strong> separates proposed copy, analysis, placement/tags, supported claims, evidence gaps, and warnings.</p>
    <p>There is intentionally no Apply-to-site action. Copy only approved wording into the appropriate deterministic editor.</p>
</template>

<template data-help-template="git-workflow">
    <p><strong>Save &amp; Publish</strong> is the normal Git workflow for this single-owner portfolio.</p>
    <p><strong>Sequence:</strong> review changed files → select exact files → inspect diff → full validation + commit to local <code>main</code> → explicitly Publish to GitHub.</p>
    <p><strong>Commit Changes</strong> creates a local checkpoint only. <strong>Publish to GitHub</strong> pushes committed <code>main</code> changes to <code>origin/main</code>, where GitHub Pages can deploy them.</p>
    <p>The manager blocks private paths, force-push, silent merges/rebases, publishing with uncommitted changes, and publishing when GitHub has newer commits.</p>
</template>

<template data-help-template="git-stage">
    <p><strong>Select Files for Commit</strong> chooses exactly which changed files belong in the next commit.</p>
    <p>Only paths Git currently reports as changed can be selected. Private/sensitive paths such as <code>.env</code>, <code>.portfolio-manager/</code>, <code>.venv/</code>, and key/certificate files are blocked.</p>
    <p><strong>Remove Selected</strong> removes files from the next commit without deleting their local edits.</p>
</template>

<template data-help-template="git-diff">
    <p><strong>Diff Review</strong> shows the line-level changes Git sees.</p>
    <p><strong>Selected</strong> changes will be included in the next commit. <strong>Not selected</strong> changes stay local and are not included yet.</p>
</template>

<template data-help-template="git-commit">
    <p><strong>Validate &amp; Commit Changes</strong> runs the full validation suite first. Any failure blocks the commit.</p>
    <p>A successful commit is created on local <code>main</code> but remains only on your Mac until you explicitly publish.</p>
    <p><strong>Next step:</strong> when you are satisfied with the committed checkpoint, use Publish to GitHub.</p>
</template>

<template data-help-template="git-push">
    <p><strong>Publish to GitHub</strong> pushes committed local <code>main</code> changes to <code>origin/main</code>.</p>
    <p>Before publishing, Portfolio Manager refreshes remote status. It blocks publication if GitHub has newer commits or if uncommitted local changes remain. Force-push is never used.</p>
    <p>After a successful push, GitHub Pages can deploy the updated public portfolio.</p>
</template>

<template data-help-template="publishing">
    <p>GitHub Pages publishes the <code>portfolio/</code> directory from approved commits on <code>main</code>.</p>
    <p>Local edits are not live. Local commits are not live. <strong>Publish to GitHub</strong> is the explicit action that pushes committed <code>main</code> changes and can trigger deployment.</p>
    <p><strong>Live path:</strong> local edit → preview → validation → select files → commit → Publish to GitHub → GitHub Pages deployment.</p>
</template>

<template data-help-template="git-safety">
    <p>Portfolio Manager performs only the Git actions needed for its simple single-owner workflow.</p>
    <p>It blocks unsafe/private paths, force-push, silent merge/rebase, and runs full validation before every commit.</p>
    <p>Publishing is always a separate explicit action after commit.</p>
</template>

<template data-help-template="privacy">
    <p>Portfolio Manager binds to <code>127.0.0.1</code>, requires your local password, protects modifying forms with CSRF, and stores private runtime data under the Git-ignored <code>.portfolio-manager/</code> directory.</p>
    <p>Your password hash, Flask secret, and optional AI API key live only in the Git-ignored local <code>.env</code> file.</p>
    <p>Sessions expire after eight hours. A timeout does not delete work; sign in again if the local Flask app is still running.</p>
</template>
