<template data-help-template="maintenance" data-help-label="Where do I start?">
    <p><strong>If it already exists:</strong> go to <strong>Manage Content</strong>. Use the page/project editor, project assets, page-aware AI, Related References, or Portfolio Review from there.</p>
    <p><strong>If it is new:</strong> go to <strong>Create Content</strong>. Start a Content Brief, or open Reference Library first when private source material needs analysis/sanitization.</p>
    <p><strong>If you are unsure:</strong> ask “Am I changing something already on my portfolio?” If yes, Manage. If no, Create.</p>
    <p>Normal content work stays local until you explicitly move it through publishing.</p>
</template>

<template data-help-template="button-safety" data-help-label="What does this button actually do?">
    <p><strong>Save Edits / Save Project:</strong> writes reviewed changes to your local working copy. Not live.</p>
    <p><strong>Approve &amp; Apply Locally:</strong> applies one reviewed page-AI proposal to local files and validates it. Review the real page afterward; you can revert the AI change before publishing. Not live.</p>
    <p><strong>Keep Local Build:</strong> reruns Full Validation against the exact generated files, then accepts that local Create Content build for continued editing. Still not live.</p>
    <p><strong>Revert Local Build:</strong> verifies every generated file first. If any generated file changed after creation, the revert stops before deleting anything.</p>
    <p><strong>Approved for Portfolio Use:</strong> allows a sanitized Reference Library derivative to be used as source context. It does not publish the file.</p>
    <p><strong>Commit:</strong> creates a Git history checkpoint on your Mac. Still not live.</p>
    <p><strong>Publish to GitHub:</strong> rechecks outgoing paths, reruns Full Validation, then pushes approved committed changes to GitHub. This is the action that can make portfolio files live through GitHub Pages.</p>
</template>

<template data-help-template="dev-workflow" data-help-label="Feature branch / PR testing">
    <p><strong>This is different from normal portfolio publishing.</strong> When we are changing Portfolio Manager itself, I usually create a feature branch and PR in GitHub, then you pull that branch and test it locally.</p>
    <p><strong>Typical development/UAT cycle:</strong> I update the feature branch → you pull it → restart Portfolio Manager → test the requested feature → tell me what worked/failed → I refine the same PR → you approve with “merge PR#”.</p>
    <p>After merge, switch back to <code>main</code> and pull the merged version. A PR merge changes the Portfolio Manager codebase; <strong>Publish to GitHub</strong> inside Portfolio Manager is the normal workflow for approved portfolio content.</p>
    <p><strong>Memory shortcut:</strong> PR/branch = developing the tool. Save &amp; Publish = using the tool to publish portfolio content.</p>
</template>

<template data-help-template="validation" data-help-label="Full Validation">
    <p><strong>Run Full Validation</strong> is a read-only health check across the public site, structured content, renderers, docs, Git guardrails, AI guardrails, and Portfolio Manager security/runtime rules.</p>
    <p>It also runs three higher-level regressions: <strong>Release end-to-end</strong>, <strong>Adversarial security/misuse</strong>, and <strong>Workflow state-safety/chaos</strong>. A successful dashboard run reports all three explicitly.</p>
    <p><strong>It changes:</strong> nothing.</p>
    <p>If it fails, stop before publishing and read the first specific failure. Guarded edit workflows often roll back the change that caused the failure.</p>
</template>

<template data-help-template="refresh-docs" data-help-label="Refresh Documentation">
    <p><strong>Refresh Docs</strong> rebuilds generated maintenance records such as the content inventory, portfolio map, and changelog.</p>
    <p>It does not rewrite public pages, commit changes, or publish anything.</p>
</template>

<template data-help-template="versioning" data-help-label="Version Releases">
    <p><strong>Version Release</strong> records an intentional portfolio-system release.</p>
    <p><strong>Patch:</strong> small fixes. <strong>Minor:</strong> meaningful new feature/project. <strong>Major:</strong> major architecture or redesign.</p>
    <p>This is system maintenance, not something you need for routine content edits.</p>
</template>

<template data-help-template="create-project" data-help-label="Create Project">
    <p><strong>Create Project</strong> creates a structured project record and, when appropriate, a standard public case-study page in the correct taxonomy path.</p>
    <p>For new portfolio work, prefer the guided <strong>Create Content Lab</strong> so purpose, evidence, safety constraints, AI planning, and the controlled build are reviewed first.</p>
    <p>Creation is local until you publish.</p>
</template>

<template data-help-template="save-project" data-help-label="Save Project Edits">
    <p><strong>Save Project Edits</strong> updates the project's structured record and refreshes generated documentation. Relevant custom-page title references stay synchronized.</p>
    <p>If validation fails, the guarded edit is rolled back.</p>
    <p>Saving is local only. Preview the result before publishing.</p>
</template>

<template data-help-template="general-content" data-help-label="Visible Page Editing">
    <p><strong>Use visible-content fields</strong> when you want to change recognizable page copy.</p>
    <p><strong>Use private page notes</strong> for reminders/ideas you do not want public. They stay in the Git-ignored private workspace.</p>
    <p><strong>Use page-aware AI</strong> when the request is structural, visual, interaction-heavy, or code-heavy.</p>
</template>

<template data-help-template="general-save" data-help-label="Save Page Copy">
    <p><strong>Save Page Copy</strong> updates approved public-page text locally. Public-safe confirmation is required when public copy changed.</p>
    <p>Validation runs immediately and guarded files are restored if validation fails.</p>
    <p>It does not commit or publish.</p>
</template>

<template data-help-template="regenerate" data-help-label="Regenerate Page">
    <p><strong>Regenerate Page</strong> rebuilds a standard project's public HTML from its current structured data and the shared template.</p>
    <p>This action is unavailable for custom interactive pages and does not commit or publish.</p>
</template>

<template data-help-template="standard-custom" data-help-label="Standard vs. Custom Pages">
    <p><strong>Standard Page:</strong> generated from structured project data + the shared case-study template and can be safely regenerated.</p>
    <p><strong>Custom Page:</strong> contains bespoke HTML/CSS/JavaScript. Portfolio Manager exposes safe visible-copy/interaction editing without letting the generic renderer overwrite the custom experience.</p>
</template>

<template data-help-template="assets" data-help-label="Project Asset Safety">
    <p><strong>Project Assets</strong> are files intentionally managed as public-candidate portfolio assets. Routine asset controls live directly in relevant project/custom-page editors.</p>
    <p>Anything under <code>portfolio/</code> may become publicly reachable after publishing even if a page does not visibly link to it.</p>
    <p>Keep confidential, proprietary, customer-identifying, unreleased, or unsanitized source material in the private Reference Library instead.</p>
</template>

<template data-help-template="asset-upload" data-help-label="Add Public Asset">
    <p><strong>Add Public Asset</strong> copies an allowed file into the project's managed public-asset folder and records its metadata.</p>
    <p>Public-safe confirmation is required. Images require alt text.</p>
    <p>Uploading associates the file with the project; it does not automatically insert the file into a page layout.</p>
</template>

<template data-help-template="asset-replace" data-help-label="Replace Asset File">
    <p><strong>Replace File</strong> swaps the bytes at an existing managed asset path while keeping the path unchanged.</p>
    <p>The extension must stay the same. Site validation runs afterward and restores the previous file on failure.</p>
</template>

<template data-help-template="ai-assistance" data-help-label="Which AI workflow should I use?">
    <p><strong>Change one existing page:</strong> use page-aware AI in that page editor.</p>
    <p><strong>Get portfolio-wide feedback:</strong> use AI Portfolio Review.</p>
    <p><strong>Understand one private source:</strong> use Ask AI About This Resource.</p>
    <p><strong>Find/redact risky source details:</strong> use Sanitization Review.</p>
    <p><strong>Build a new portfolio project:</strong> use Create Content Lab.</p>
    <p><strong>One-off rewrite/analysis/drafting:</strong> use Advanced AI Drafting Helper.</p>
    <p>Every private-source AI workflow shows what will be sent and requires authorization acknowledgement before the external request.</p>
</template>

<template data-help-template="ai-proposal" data-help-label="Generic AI Proposal">
    <p><strong>Use in Existing Content</strong> opens the real editor and stages proposal text only after you choose <strong>Insert Draft into Field</strong>. It does not auto-save; Undo restores the previous field value.</p>
    <p><strong>Create Something New</strong> prefills an unsaved Content Brief. <strong>Save for Later</strong> changes private proposal status only.</p>
    <p>This helper has no direct Git or publishing authority.</p>
</template>

<template data-help-template="page-ai" data-help-label="Page-aware AI">
    <p><strong>Workflow:</strong> request → private proposal → review exact anchored operations → Approve &amp; Apply Locally → automatic validation → real preview → revert or continue into the normal Save &amp; Publish workflow.</p>
    <p>The source page is rechecked before applying and a private backup is created first. Only the exact reviewed operations may be applied.</p>
    <p>Applying locally is not publishing.</p>
</template>

<template data-help-template="portfolio-review" data-help-label="AI Portfolio Review">
    <p><strong>AI Portfolio Review</strong> reads the public portfolio only and returns advisory QA/improvement findings.</p>
    <p>It does not edit pages, read private Reference Library sources, perform Git actions, or publish. The current review is one unified lens and does not perform web research.</p>
</template>

<template data-help-template="related-references" data-help-label="Related References">
    <p><strong>Related References</strong> is deterministic, not AI. It appears when an identity/title-style change may affect other public references.</p>
    <p>For each match, choose Update Reference, Edit Suggested Text, or Leave Unchanged. Guarded writes are validated and rolled back on failure.</p>
</template>

<template data-help-template="reference-library" data-help-label="Private Reference Library">
    <p><strong>Reference Library</strong> is where private professional source material belongs before it is ready for public use.</p>
    <p>Original files stay under Git-ignored <code>.portfolio-manager/</code> storage and are preserved unchanged. Sanitized work is a separate derivative.</p>
    <p><strong>Approved for Portfolio Use</strong> means the sanitized derivative may be used as Content Brief source context. It does not publish the file.</p>
    <p>If a Content Brief still depends on a reference or its sanitized derivative, destructive deletion is blocked until you detach that source from the brief.</p>
</template>

<template data-help-template="reference-ai" data-help-label="Ask AI About This Resource">
    <p>This tool can identify skills, evidence, gaps, reusable elements, portfolio opportunities, and likely placement.</p>
    <p>Text-extractable sources show the exact local extraction before send. Supported images show the actual image and require a visual acknowledgement because image pixels are not locally OCR/preflighted.</p>
    <p>Private notes, tags, approval notes, unrelated resources, and credentials are excluded. The result remains private.</p>
</template>

<template data-help-template="sanitization" data-help-label="Sanitization Review">
    <p><strong>AI flags; you decide.</strong> Review each possible public-safety risk and choose Keep, Remove, Generalize, Rewrite, Replace, Crop/redact, or Mark intentionally public-safe.</p>
    <p>The original stays untouched. The workflow creates a separate Sanitized Draft that still requires explicit approval.</p>
    <p>If an approved sanitized derivative is attached to a Content Brief, Portfolio Manager blocks deleting it until that dependency is removed.</p>
</template>

<template data-help-template="create-content" data-help-label="Create Content Lab">
    <p><strong>Workflow:</strong> Content Brief → optional Approved Sources → AI Content Plan → human plan approval → AI Build Proposal → human edit/review → Create Local Project &amp; Validate → Preview → Keep/Revert.</p>
    <p>Approved Reference Library context uses sanitized derivatives only; private originals stay outside the brief/build AI context.</p>
    <p>Controlled build writes local files only after explicit approval and validation. It never publishes automatically.</p>
    <p><strong>State safety:</strong> an active/kept build protects its Content Brief from destructive edits or deletion. Keep reruns Full Validation against the exact files being approved. Revert checks every generated-file hash before deleting anything, so a changed file causes the entire revert to stop without partial deletion.</p>
</template>

<template data-help-template="ai-file-review" data-help-label="AI File Review Safety">
    <p>Advanced AI Drafting Helper attachments are prepared locally first. Review the exact extracted text and any image previews before sending.</p>
    <p>Images require a visual acknowledgement because pixels are not locally OCR/preflighted. Credential-like extracted text can block generation.</p>
    <p>Temporary binary uploads are Git-ignored and are removed after successful generation or when you discard the prepared request.</p>
</template>

<template data-help-template="git-workflow" data-help-label="Save & Publish Safety">
    <p><strong>Working copy:</strong> files on your Mac right now.</p>
    <p><strong>Commit:</strong> local Git checkpoint. Not live.</p>
    <p><strong>Push / Publish to GitHub:</strong> sends committed <code>main</code> changes to GitHub and can trigger the live site deployment.</p>
    <p><strong>Normal sequence:</strong> preview → Full Validation → review changed files → inspect diff → commit → Publish to GitHub.</p>
    <p>Immediately before push, Portfolio Manager checks every outgoing path for forbidden/private files and reruns the current Full Validation suite. A failed check blocks publishing.</p>
    <p>If you are on a feature branch testing a Portfolio Manager PR, use the separate development/UAT workflow instead.</p>
</template>

<template data-help-template="git-stage" data-help-label="Select Files for Commit">
    <p><strong>Select Files for Commit</strong> chooses exactly which changed files belong in the next local checkpoint.</p>
    <p>Private/sensitive paths such as <code>.env</code>, <code>.portfolio-manager/</code>, <code>.venv/</code>, and key/certificate files are blocked.</p>
    <p><strong>Remove Selected</strong> removes files from the next commit without deleting their local edits.</p>
</template>

<template data-help-template="git-diff" data-help-label="Diff Review">
    <p><strong>Diff Review</strong> shows exactly what Git thinks changed.</p>
    <p>Use it as the “does this change match what I meant to do?” checkpoint before committing.</p>
</template>

<template data-help-template="git-commit" data-help-label="Commit Changes">
    <p><strong>Validate &amp; Commit Changes</strong> runs the full validation suite first. Any failure blocks the commit.</p>
    <p>A successful commit is a saved local checkpoint on <code>main</code>. It is not live until you publish.</p>
</template>

<template data-help-template="git-push" data-help-label="Publish to GitHub">
    <p><strong>Publish to GitHub</strong> pushes committed local <code>main</code> changes to <code>origin/main</code>.</p>
    <p>Before push, Portfolio Manager scans every outgoing commit path for forbidden/private material and reruns Full Validation. It also blocks publishing if GitHub has newer commits or uncommitted local changes remain. Force-push is never used.</p>
    <p>After a successful push, GitHub Pages can deploy the updated public portfolio.</p>
</template>

<template data-help-template="publishing" data-help-label="What actually gets published?">
    <p><strong>Not live:</strong> editing a form, Save Edits, validation, AI proposals, Keep, approved Reference Library sources, and local Git commits.</p>
    <p><strong>Potentially live:</strong> public-candidate files under <code>portfolio/</code> and tracked content that has been committed and then explicitly pushed with <strong>Publish to GitHub</strong>.</p>
    <p><strong>GitHub Pages deploys only <code>portfolio/</code></strong>, but this repository is public, so any other tracked file pushed to GitHub is still publicly visible in the repository even if it is not part of the website.</p>
    <p>If you are asking “did I just make this public?” the answer is no unless the workflow actually pushed the approved commit to GitHub.</p>
</template>

<template data-help-template="git-safety" data-help-label="Git Safety">
    <p>Portfolio Manager blocks unsafe/private paths, force-push, silent merge/rebase behavior, and runs full validation before every commit and immediately before publish.</p>
    <p>Publishing is always a separate explicit action after commit.</p>
</template>

<template data-help-template="privacy" data-help-label="Privacy & Security">
    <p><strong>Portfolio Manager itself:</strong> stays local-only on <code>127.0.0.1:5055</code>; it is not intentionally exposed to your local network or the internet.</p>
    <p><strong><code>.env</code>:</strong> local secrets. Git-ignored.</p>
    <p><strong><code>.portfolio-manager/</code>:</strong> private working data, AI records, backups, Content Briefs, Reference Library originals/derivatives, and temporary uploads. Git-ignored.</p>
    <p><strong><code>portfolio-data/</code>:</strong> Git-tracked structured content. Treat it as publishable repository content.</p>
    <p><strong><code>portfolio/</code>:</strong> public-candidate website files/assets. Anything here may become reachable after publishing.</p>
    <p><strong>AI:</strong> only the context disclosed by the specific workflow is sent after the required review/acknowledgements. Private notes/tags and unrelated sources are not silently included.</p>
    <p><strong>Reference Library:</strong> originals remain unchanged; sanitized derivatives are separate; approval still does not publish.</p>
</template>
