<template data-help-template="validation">
    <p><strong>Run Full Validation</strong> is read-only. It runs the same core checks used by the pull-request workflow.</p>
    <p>It checks the public site, structured content, renderers/generator, docs/versioning, Git guardrails, AI-assistance guardrails, and Portfolio Manager security/runtime behavior.</p>
</template>

<template data-help-template="refresh-docs">
    <p><strong>Refresh Docs</strong> rebuilds maintenance documentation about the portfolio.</p>
    <p>It does not regenerate public HTML, commit, push, merge, or publish.</p>
</template>

<template data-help-template="versioning">
    <p><strong>Patch:</strong> small fixes. <strong>Minor:</strong> meaningful new feature/project. <strong>Major:</strong> major redesign or architecture shift.</p>
    <p>A version release changes local version/history documentation only until you use Git Workflow.</p>
</template>

<template data-help-template="requests">
    <p><strong>Requests</strong> are private work orders, not automatic edits.</p>
    <p>Requests and attached source/reference files stay under the Git-ignored <code>.portfolio-manager/</code> workspace and are not automatically sent to AI.</p>
</template>

<template data-help-template="create-project">
    <p><strong>Create Project</strong> creates real structured project files using the guided generator, then validates and refreshes generated docs.</p>
    <p>It does not commit, push, merge, or publish.</p>
</template>

<template data-help-template="save-project">
    <p><strong>Save Project Data</strong> updates structured project JSON and refreshes generated documentation.</p>
    <p>Custom interactive HTML remains protected from the generic renderer.</p>
</template>

<template data-help-template="general-content">
    <p><strong>General Page Content</strong> manages a predefined set of plain-text fields on Home, About, Projects, category pages, and Contact.</p>
    <p>Navigation, links, buttons, tags, CSS, JavaScript, layout, and custom interactions are not exposed here.</p>
</template>

<template data-help-template="general-save">
    <p><strong>Save Page Copy</strong> updates structured general-page source plus the exact approved public HTML text location.</p>
    <p>Copy is escaped as plain text, validated immediately, and rolled back if validation fails. Nothing is committed or published automatically.</p>
</template>

<template data-help-template="regenerate">
    <p><strong>Regenerate Page</strong> rebuilds a standard generated project's public HTML from the latest project JSON + shared template.</p>
    <p>This action is intentionally unavailable for custom interactive pages.</p>
</template>

<template data-help-template="standard-custom">
    <p><strong>Standard Page:</strong> generated from structured JSON + shared template and can be safely regenerated.</p>
    <p><strong>Custom Page:</strong> bespoke HTML/CSS/JavaScript interaction. Metadata can be managed, but the generic renderer cannot overwrite it.</p>
</template>

<template data-help-template="assets">
    <p><strong>Asset Library</strong> is for files intentionally approved for the public portfolio.</p>
    <p>Managed assets live under <code>portfolio/assets/project-assets/</code>; after merge, a file there may be publicly reachable even when no page visibly links to it.</p>
</template>

<template data-help-template="asset-upload">
    <p><strong>Add Public Asset</strong> copies an allowed file into the managed public folder and records its project metadata.</p>
    <p>Images require alt text. HTML, JavaScript, CSS, SVG, executables, shell scripts, and archives remain blocked.</p>
</template>

<template data-help-template="asset-replace">
    <p><strong>Replace File</strong> swaps the bytes at an existing managed asset path while preserving its path and extension.</p>
    <p>Site validation runs and restores the old file if validation fails.</p>
</template>

<template data-help-template="ai-assistance">
    <p><strong>AI Assistance</strong> creates private proposals for rewriting, sanitization, source analysis, placement/tags, and project-summary drafting.</p>
    <p><strong>What is sent:</strong> source/context you deliberately enter in the AI workspace plus the repo's public portfolio taxonomy. Project pages, private requests, uploads, and arbitrary source files are not automatically sent.</p>
    <p><strong>Before sending:</strong> local preflight blocks several obvious secret formats, and you must confirm external-provider awareness plus authorization to send the text.</p>
    <p><strong>What AI cannot do:</strong> edit portfolio files, edit structured JSON, stage/commit/push Git changes, create a merge, or publish. Proposals stay under <code>.portfolio-manager/ai-proposals/</code>.</p>
</template>

<template data-help-template="ai-proposal">
    <p><strong>AI Proposal Review</strong> separates copy, analysis, placement, source-supported claims, evidence gaps, and warnings.</p>
    <p>The source is retained in the private local proposal record so you can audit what the AI saw.</p>
    <p>Approval means copying what you accept into General Page Content or Project Content. There is intentionally no AI Apply-to-site action.</p>
</template>

<template data-help-template="git-workflow">
    <p><strong>Git Workflow</strong> handles guarded feature-branch mechanics: safe main sync, branch creation, exact-file staging, diff review, validation-gated commit, feature-branch push, and PR creation/fallback.</p>
    <p>It cannot commit or push <code>main</code>, force-push, stage blocked private paths, run arbitrary shell commands, or merge a PR.</p>
</template>

<template data-help-template="git-stage">
    <p><strong>Stage Selected Files</strong> chooses exactly which Git-reported changes belong in the next commit.</p>
    <p><strong>Unstage</strong> removes a file from the next commit without deleting its local edit.</p>
</template>

<template data-help-template="git-diff">
    <p><strong>Diff Review</strong> shows the actual line-level staged and unstaged changes Git sees before you commit.</p>
</template>

<template data-help-template="git-commit">
    <p><strong>Run Validation & Commit</strong> runs the full portfolio suite first. Any failed check blocks the commit.</p>
    <p>Commits on <code>main</code> are blocked.</p>
</template>

<template data-help-template="git-push">
    <p><strong>Push Branch to GitHub</strong> sends committed feature-branch changes to origin with normal upstream tracking.</p>
    <p>Pushes to <code>main</code> and force-push are unavailable.</p>
</template>

<template data-help-template="git-pr">
    <p><strong>Open Pull Request</strong> creates a review request when GitHub CLI is authenticated, otherwise it opens GitHub's pre-filled PR page.</p>
    <p>Merge remains intentionally separate.</p>
</template>

<template data-help-template="publishing">
    <p>GitHub Pages publishes <code>portfolio/</code> only after approved changes reach <code>main</code>.</p>
    <p><strong>Live path:</strong> local change → stage → validation + commit → push feature branch → PR → explicit merge → GitHub Pages.</p>
    <p>Private requests, uploads, credentials, and AI proposals are outside that path.</p>
</template>

<template data-help-template="git-safety">
    <p>Git actions are available only through the guarded Git Workflow page. No merge route exists.</p>
</template>

<template data-help-template="privacy">
    <p>Portfolio Manager binds to <code>127.0.0.1</code>, requires your local password, protects POST actions with CSRF, and stores private runtime data under Git-ignored <code>.portfolio-manager/</code>.</p>
    <p>Your password hash, Flask secret, and optional AI API key live only in the Git-ignored local <code>.env</code>.</p>
</template>
